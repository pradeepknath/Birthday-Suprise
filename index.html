<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Birthday My Love ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Music -->
    <audio autoplay loop>
        <source src="music.mp3" type="audio/mp3">
    </audio>

    <div class="container">
        <h1>🎉 Happy Birthday babeeeee (Chipkalii Motki🥱😘😚)🥰🎉 ❤️ 🎉</h1>
        <div> 
            <img src="Images/IMG-20250529-WA0013.jpg" alt="Birthday Image" style="width: 200px; height: 250px; border-radius: 5px;">
            <img src="Images/IMG-20251023-WA0000.jpg" alt="Birthday Image" style="width: 230px; height: 250px; border-radius: 5px;">
            <img src="Images/IMG-20251023-WA0008.jpg" alt="Birthday Image" style="width: 200px; height: 230px; border-radius: 5px;">
            <img src="Images/IMG-20251112-WA0008.jpg" alt="Birthday Image" style="width: 230px; height: 250px; border-radius: 5px;">
            <img src="Images/IMG-20260301-WA0002.jpg" alt="Birthday Image" style="width: 250px; height: 250px; border-radius: 5px;">
        </div>
        <img src="Images/IMG-20260301-WA0008.jpg" alt="Birthday Image" style="width: 250px; height: 250px; border-radius: 5px;">
        <img src="Images/IMG-20260301-WA0009.jpg" alt="Birthday Image" style="width: 250px; height: 250px; border-radius: 5px;">
        <img src="Images/SAVE_20250830_185050.jpg" alt="Birthday Image" style="width: 250px; height: 250px; border-radius: 5px;">
        <img src="Images/SAVE_20250830_185222.jpg" alt="Birthday Image" style="width: 250px; height:250px; border-radius: 5px;">
        
        <!-- Messages -->
        <p id="msg1" class="message">You are my greatest blessing,my forever love 😊</p>
        <p id="msg2" class="message hidden">You are the beautiful part happened in my life 💖</p>
        <p id="msg3" class="message hidden">I will love you forever ❤️</p>

        <!-- Slideshow -->
        <div class="slideshow">
            <img src="Images/Snapchat-1152257859.jpg" class="slide active">
            <img src="Images/Snapchat-1035702090.jpg" class="slide">
            <img src="Images/Snapchat-294679681.jpg" class="slide">
            <img src="Images/Snapchat-1948041128.jpg" class="slide">
            <img src="Images/Snapchat-2108371140.jpg" class="slide">
        </div>

        <button onclick="showLove()">Click for Surprise 💌</button>
        <p id="hiddenMessage">Agha k Suprise chaiyo🥱 Kei Suprise mildaina khurukka suta tya 🥱</p>
    </div>

    <!-- Floating hearts + stars container -->
    <div class="hearts"></div>
    <div class="stars"></div>

<script>
    // Message pop-up
    setTimeout(() => { document.getElementById("msg1").style.opacity = "1"; }, 500);
    setTimeout(() => { document.getElementById("msg2").style.opacity = "1"; }, 3000);
    setTimeout(() => { document.getElementById("msg3").style.opacity = "1"; }, 6000);

    // Slideshow
    let index = 0;
    let slides = document.querySelectorAll(".slide");
    function showSlides() {
        slides.forEach(slide => slide.classList.remove("active"));
        index = (index + 1) % slides.length;
        slides[index].classList.add("active");
    }
    setInterval(showSlides, 3000);

    // Surprise message
    function showLove() {
        document.getElementById("hiddenMessage").style.display = "block";
    }

    // Floating hearts
    setInterval(() => {
        let heart = document.createElement("div");
        heart.classList.add("heart");
        heart.style.left = Math.random() * 100 + "vw";
        heart.innerText = "❤️";
        document.body.appendChild(heart);
        setTimeout(() => { heart.remove(); }, 4000);
    }, 500);

    // Stars effect
    const starsContainer = document.querySelector('.stars');
    for(let i=0;i<50;i++){
        let star = document.createElement('div');
        star.classList.add('star');
        star.style.top = Math.random()*100 + 'vh';
        star.style.left = Math.random()*100 + 'vw';
        star.style.animationDuration = (Math.random()*3+2)+'s';
        starsContainer.appendChild(star);
    }
</script>

</body>
</html>
